name: Inspect match event markup

on:
  push:
    paths:
      - "scripts/inspect_match_markup.py"
      - ".github/workflows/inspect-match-markup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - run: python scripts/inspect_match_markup.py
