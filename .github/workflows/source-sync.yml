name: Sync data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force source refresh"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/workflows/source-sync.yml"
      - "config/competitions.json"
      - "config/sources.json"
      - "data/fixture_schedule.csv.gz"
      - "scripts/source_sync.py.gz"
      - "scripts/source_sync_runner.py"
      - "scripts/detail_parser.py"

permissions:
  contents: write

concurrency:
  group: source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_SYNC: ${{ github.event.inputs.force || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4

      - name: Prepare
        shell: bash
        run: |
          gzip -dc scripts/source_sync.py.gz > scripts/source_sync.py
          gzip -dc data/fixture_schedule.csv.gz > data/fixtures.csv

      - name: Sync
        shell: bash
        run: |
          if [ "$FORCE_SYNC" = "true" ]; then
            python scripts/source_sync_runner.py --force
          else
            python scripts/source_sync_runner.py
          fi

      - name: Publish data
        shell: bash
        run: |
          if git diff --quiet -- data/engine-state.json data/matches.json data/upcoming.json data/competitions.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/engine-state.json data/matches.json data/upcoming.json data/competitions.json
          git commit -m "Update data"
          git push
