name: Clean deleted match photos

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/photos.json"
      - "scripts/photo_cleanup.py"

permissions:
  contents: write

concurrency:
  group: clean-match-photos
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Remove deleted Tally photos
        run: python scripts/photo_cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- data/photos.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json
          git commit -m "Remove deleted match photos"
          git pull --rebase origin main
          git push
