name: Sync reports

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force report source check"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "data/matches.json"
      - "config/report-sources.json"
      - "scripts/report_sync.py"

permissions:
  contents: write

concurrency:
  group: report-sync
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ubuntu-latest
    env:
      FORCE_REPORT_SYNC: ${{ github.event.inputs.force || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4

      - name: Check sources
        shell: bash
        run: |
          if [ "$FORCE_REPORT_SYNC" = "true" ]; then
            python scripts/report_sync.py --force
          else
            python scripts/report_sync.py
          fi

      - name: Publish reports
        shell: bash
        run: |
          if git diff --quiet -- data/reports.json data/report-state.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/report-state.json
          git commit -m "Update reports"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced with another update; retry $attempt/3"
            sleep $((attempt * 2))
          done

          echo "::error::Could not push report update after 3 attempts"
          exit 1
