name: Oppdater fotballdata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FOTBALLDATA_CID: ${{ secrets.FOTBALLDATA_CID }}
      FOTBALLDATA_CWD: ${{ secrets.FOTBALLDATA_CWD }}

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sjekk konfigurasjon
        id: config
        shell: bash
        run: |
          if [[ -z "$FOTBALLDATA_CID" || -z "$FOTBALLDATA_CWD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Fotballdata-secrets mangler. Ingen data blir hentet."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hent og normaliser ferdigspilte kamper
        if: steps.config.outputs.ready == 'true'
        run: python scripts/update_matches.py

      - name: Commit oppdaterte data
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/matches.json; then
            echo "Ingen endringer i kampdata."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "Oppdater kampdata"
          git push
