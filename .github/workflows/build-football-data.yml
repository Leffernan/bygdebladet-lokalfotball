name: Bygg NFF-kampdata

on:
  workflow_dispatch:
  push:
    paths:
      - "data/nff-import.json"
      - "config/nff.json"
      - "scripts/build_matches.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valider og bygg kampdata
        run: python scripts/build_matches.py

      - name: Commit oppdaterte kampdata
        shell: bash
        run: |
          if git diff --quiet -- data/matches.json; then
            echo "Ingen endringer i kampdata."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "Bygg NFF-verifiserte kampdata"
          git push
